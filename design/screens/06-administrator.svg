<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">ThesisFlow — Department overview</title><desc id="desc">Desktop design mockup. All names, scores, counts and records are illustrative sample data.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F4F6F8" stroke="none"/><rect x="0" y="0" width="240" height="1000" rx="0" fill="#142D32" stroke="none"/><rect x="28" y="30" width="36" height="36" rx="10" fill="#A8DDC8" stroke="none"/><text x="37" y="55" fill="#142D32" font-size="25" font-weight="700">T</text><text x="76" y="55" fill="#FFFFFF" font-size="22" font-weight="700">ThesisFlow</text><text x="28" y="100" fill="#A0BABB" font-size="10" font-weight="600">ASTANA IT UNIVERSITY</text><text x="28" y="157" fill="#A0BABB" font-size="10" font-weight="600">ADMINISTRATOR WORKSPACE</text><rect x="16" y="180" width="208" height="46" rx="10" fill="#29464A" stroke="none"/><rect x="16" y="192" width="3" height="22" rx="1" fill="#A8DDC8" stroke="none"/><g transform="translate(31 191)" fill="none" stroke="#B8E9D5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h6v6H3z M15 3h6v6h-6z M3 15h6v6H3z M15 15h6v6h-6z"/></g><text x="68" y="209" fill="#FFFFFF" font-size="14" font-weight="600">Overview</text><g transform="translate(31 247)" fill="none" stroke="#A0BABB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M2 21v-3a7 7 0 0 1 14 0v3 M18 5a4 4 0 0 1 0 7 M20 15a5 5 0 0 1 3 4v2"/></g><text x="68" y="265" fill="#BCCCD0" font-size="14" font-weight="400">Supervisors</text><g transform="translate(31 303)" fill="none" stroke="#A0BABB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v16H4z M13 4h7v16h-7z"/></g><text x="68" y="321" fill="#BCCCD0" font-size="14" font-weight="400">Topic allocation</text><g transform