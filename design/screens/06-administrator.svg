" font-weight="700">DEPARTMENT OVERVIEW</text><text x="280" y="171" fill="#172E33" font-size="32" font-weight="700">A clear view of every allocation.</text><text x="280" y="202" fill="#687C80" font-size="15" font-weight="400">Monitor supervisor capacity and help teams find their next step.</text><rect x="280" y="238" width="264" height="116" rx="16" fill="#FFFFFF" stroke="#E1E8E9"/><text x="302" y="266" fill="#687C80" font-size="13" font-weight="400">Registered students</text><text x="302" y="310" fill="#172E33" font-size="30" font-weight="700">148</text><text x="302" y="335" fill="#687C80" font-size="12" font-weight="400">Illustrative cohort data</text><rect x="560" y="238" width="264" height="116" rx="16" fill="#FFFFFF" stroke="#E1E8E9"/><text x="582" y="266" fill="#687C80" font-size="13" font-weight="400">Approved teams</text><text x="582" y="310" fill="#172E33" font-size="30" font-weight="700">42</text><text x="582" y="335" fill="#687C80" font-size="12" font-weight="400">120 students allocated</text><rect x="840" y="238" width="264" height="116" rx="16" fill="#FFFFFF" stroke="#E1E8E9"/><text x="862" y="266" fill="#687C80" font-size="13" font-weight="400">Students unallocated</text><text x="862" y="310" fill="#172E33" font-size="30" font-weight="700">28</text><text x="862" y="335" fill="#687C80" font-size="12" font-weight="400">18.9% of registered students</text><rect x="1120" y="238" width="264" height="116" rx="16" fill="#FFFFFF" stroke="#E1E8E9"/><text x="1142" y="266" fill="#687C80" font-size="13" font-weight="400">Supervisors at capacity</text><text x="1142" y="310" fill="#172E33" font-size="30" font-weight="700">3 / 12</text><text x="1142" y="335" fill="#687C80" font-size="12" font-weight="400">Review before new allocations</text><rect x="280" y="378" width="1104" height="92" rx="16" fill="#FFF3DA" stroke="none"/><text x="304" y="414" fill="#94651C" font-size="18" font-weight="700">3 supervisors have reached their team limit</text><text x="304" y="442" fill