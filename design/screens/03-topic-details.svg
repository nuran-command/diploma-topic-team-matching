<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">ThesisFlow — Topic details</title><desc id="desc">Desktop design mockup. All names, scores, counts and records are illustrative sample data.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F4F6F8" stroke="none"/><rect x="0" y="0" width="240" height="1000" rx="0" fill="#142D32" stroke="none"/><rect x="28" y="30" width="36" height="36" rx="10" fill="#A8DDC8" stroke="none"/><text x="37" y="55" fill="#142D32" font-size="25" font-weight="700">T</text><text x="76" y="55" fill="#FFFFFF" font-size="22" font-weight="700">ThesisFlow</text><text x="28" y="100" fill="#A0BABB" font-size="10" font-weight="600">ASTANA IT UNIVERSITY</text><text x="28" y="157" fill="#A0BABB" font-size="10" font-weight="600">STUDENT WORKSPACE</text><g transform="translate(31 191)" fill="none" stroke="#A0BABB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h6v6H3z M15 3h6v6h-6z M3 15h6v6H3z M15 15h6v6h-6z"/></g><text x="68" y="209" fill="#BCCCD0" font-size="14" font-weight="400">Overview</text><rect x="16" y="236" width="208" height="46" rx="10" fill="#29464A" stroke="none"/><rect x="16" y="248" width="3" height="22" rx="1" fill="#A8DDC8" stroke="none"/><g transform="translate(31 247)" fill="none" stroke="#B8E9D5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v16H4z M13 4h7v16h-7z"/></g><text x="68" y="265" fill="#FFFFFF" font-size="14" font-weight="600">Explore topics</text><g transform="translate(31 303)" fill="none" stroke="#A0BABB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M2 21v-3a7 7 0 0 1 14 0v3 M18 5a4 4 0 0 1 0 7 M20 15a5 5 0 0 1 3 4v2"/></g><text x="68" y="321" fill="#BCCCD0" font-size="14" font-weight="400">My team</text><g transform="translate(31 359)" fill="none" stroke="#A0BABB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l5 5v15H6z M14 2v6h5 M9 12h7 M9 16h7"/></g><text x="68" y="377" fill="#BCCCD0" font-size="14" font-weight="400">Applications</text><rect x="20" y="756" width="200" height="122" rx="12" fill="#203D41" stroke="none"/><text x="36" y="786" fill="#FFFFFF" font-size="14" font-weight="600">Your next chapter</text><text x="36" y="810" fill="#BDD1CF" font-size="12" font-weight="400">A topic. A team. A start.</text><text x="36" y="851" fill="#A8DDC8" font-size="12" font-weight="400">Capstone 2025–2026</text><path d="M24 908H216" stroke="#355055"/><rect x="24" y="930" width="40" height="40" rx="20" fill="#E7F3EF" stroke="none"/><text text-anchor="middle" x="44" y="956" fill="#147D73" font-size="13" font-weight="700">NZ</text><text x="76" y="947" fill="#FFFFFF" font-size="13" font-weight="600">Nurdan Z.</text><text x="76" y="967" fill="#A0BABB" font-size="11" font-weight="400">SE-2402 · Student</text><rect x="240" y="0" width="1200" height="88" rx="0" fill="#FFFFFF" stroke="none"/><path d="M240 88H1440" stroke="#E1E8E9"/><text x="280" y="49" fill="#687C80" font-size="13" font-weight="400">Workspace</text><text x="362" y="49" fill="#172E33" font-size="13" font-weight="500">/  Explore topics</text><rect x="1070" y="28" width="126" height="28" rx="14" fill="#F1F4F6" stroke="none"/><text x="1082" y="47" fill="#687C80" font-size="12" font-weight="600">AY 2025–2026</text><g transform="translate(1230 31)" fill="none" stroke="#687C80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14l-2-4V8a5 5 0 0 0-10 0v5z M10 21h4"/></g><rect x="1282" y="24" width="40" height="40" rx="20" fill="#E7F3EF" stroke="none"/><text text-anchor="middle" x="1302" y="50" fill="#147D73" font-size="13" font-weight="700">NZ</text><text x="1334" y="49" fill="#687C80" font-size="12" font-weight="400">Student</text><text x="280" y="130" fill="#147D73" font-size="13" font-weight="600">← Back to topics</text><rect x="280" y="152" width="129" height="28" rx="14" fill="#E7F3EF" stroke="none"/><text x="292" y="171" fill="#147D73" font-size="12" font-weight="600">WEB DEVELOPMENT</text><rect x="448" y="152" width="164" height="28" rx="14" fill="#EDF5EA" stroke="none"/><text x="460" y="171" fill="#4B7841" font-size="12" font-weight="600">Open for applications</text><text x="280" y="226" fill="#172E33" font-size="34" font-weight="700">Campus Services Platform</text><text x="280" y="258" fill="#687C80" font-size="15" font-weight="400">One place for students to request, track, and access campus services.</text><rect x="280" y="294" width="704" height="258" rx="16" fill="#FFFFFF" stroke="#E1E8E9"/><text x="304" y="334" fill="#172E33" font-size="20" font-weight="700">About the project</text><text x="304" y="369" fill="#687C80" font-size="15" font-weight="400">Students currently navigate separate channels for routine campus requests.</text><text x="304" y="394" fill="#687C80" font-size="15" font-weight="400">Design and build a web platform that brings these services together,</text><text x="304" y="419" fill="#687C80" font-size="15" font-weight="400">with clear ownership and visible request progress.</text><text x="304" y="470" fill="#172E33" font-size="14" font-weight="600">Expected deliverables</text><text x="304" y="500" fill="#687C80" font-size="14" font-weight="400">Responsive web app · REST API · Usability evaluation</text><rect x="280" y="576" width="704" height="174" rx="16" fill="#FFFFFF" stroke="#E1E8E9"/><text x="304" y="616" fill="#172E33" font-size="20" font-weight="700">Skills and team requirements</text><rect x="304" y="637" width="59" height="28" rx="14" fill="#E7F3EF" stroke="none"/><text x="316" y="656" fill="#147D73" font-size="12" font-weight="600">React</text><rect x="380" y="637" width="73" height="28" rx="14" fill="#E7F3EF" stroke="none"/><text x="392" y="656" fill="#147D73" font-size="12" font-weight="600">FastAPI</text><rect x="470" y="637" width="94" height="28" rx="14" fill="#E7F3EF" stroke="none"/><text x="482" y="656" fill="#147D73" font-size="12" font-weight="600">PostgreSQL</text><text x="304" y="710" fill="#687C80" font-size="14" font-weight="400">Team size: 2–3 students     Required roles: Frontend + Backend</text><rect x="280" y="774" width="704" height="162" rx="16" fill="#FFFFFF" stroke="#E1E8E9"/><text x="304" y="813" fill="#172E33" font-size="18" font-weight="700">Supervisor</text><rect x="304" y="836" width="40" height="40" rx="20" fill="#E7F3EF" stroke="none"/><text text-anchor="middle" x="324" y="862" fill="#147D73" font-size="13" font-weight="700">NN</text><text x="360" y="853" fill="#172E33" font-size="16" font-weight="600">Nurtas K. Nadirov</text><text x="360" y="879" fill="#687C80" font-size="13" font-weight="400">School of Software Engineering</text><text x="304" y="914" fill="#147D73" font-size="13" font-weight="600">Available capacity: 2 additional teams</text><rect x="1008" y="294" width="376" height="328" rx="16" fill="#FFFFFF" stroke="#E1E8E9"/><rect x="1032" y="318" width="87" height="28" rx="14" fill="#E7F3EF" stroke="none"/><text x="1044" y="337" fill="#147D73" font-size="12" font-weight="600">94% match</text><text x="1032" y="383" fill="#172E33" font-size="19" font-weight="700">Why this fits your profile</text><g transform="translate(1032 401)" fill="none" stroke="#147D73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 5"/></g><text x="1066" y="416" fill="#172E33" font-size="14" font-weight="600">Skills overlap</text><text x="1066" y="438" fill="#687C80" font-size="12" font-weight="400">Python, FastAPI, PostgreSQL</text><g transform="translate(1032 458)" fill="none" stroke="#147D73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 5"/></g><text x="1066" y="473" fill="#172E33" font-size="14" font-weight="600">Shared interests</text><text x="1066" y="495" fill="#687C80" font-size="12" font-weight="400">Campus tools and web platforms</text><g transform="translate(1032 515)" fill="none" stroke="#147D73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 5"/></g><text x="1066" y="530" fill="#172E33" font-size="14" font-weight="600">Role alignment</text><text x="1066" y="552" fill="#687C80" font-size="12" font-weight="400">Your backend role is relevant</text><rect x="1008" y="646" width="376" height="290" rx="16" fill="#E7F3EF" stroke="none"/><text x="1032" y="685" fill="#172E33" font-size="20" font-weight="700">Apply as a team</text><text x="1032" y="717" fill="#172E33" font-size="14" font-weight="600">Team: Campus Collective</text><text x="1032" y="745" fill="#687C80" font-size="13" font-weight="400">2 members · 1 open position</text><text x="1032" y="786" fill="#687C80" font-size="13" font-weight="400">Review the requirements together.</text><text x="1032" y="809" fill="#687C80" font-size="13" font-weight="400">Your supervisor makes the final decision.</text><rect x="1032" y="834" width="328" height="42" rx="10" fill="#147D73" stroke="none"/><text text-anchor="middle" x="1196" y="860" fill="#FFFFFF" font-size="14" font-weight="600">Review application</text><text x="1032" y="910" fill="#687C80" font-size="12" font-weight="400">You can review before submitting.</text></g></svg>
