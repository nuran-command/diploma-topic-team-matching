<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="480" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">System Architecture Diagram</text>
  <text x="480" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Intelligent Web System for Selecting Diploma Topics &amp; Forming Student Teams</text>

  <!-- LAYER 1: CLIENT LAYER -->
  <rect x="50" y="95" width="860" height="135" rx="12" fill="url(#clientGrad)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="125" fill="#60a5fa" font-size="14" font-weight="700">1. PRESENTATION LAYER (React 18 + Vite + Tailwind CSS)</text>
  
  <rect x="70" y="140" width="250" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="195" y="165" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Student Dashboard</text>
  <text x="195" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">Profile, Skill Matrix, Topic Recomms</text>
  <text x="195" y="200" text-anchor="middle" fill="#94a3b8" font-size="11">Teammate Discovery &amp; Invitations</text>

  <rect x="355" y="140" width="250" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="480" y="165" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Supervisor Portal</text>
  <text x="480" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">Topic Proposal, Prerequisite Tags</text>
  <text x="480" y="200" text-anchor="middle" fill="#94a3b8" font-size="11">Team Application Review &amp; Quotas</text>

  <rect x="640" y="140" width="250" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="765" y="165" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Dean's Admin Console</text>
  <text x="765" y="185" text-anchor="middle" fill="#94a3b8" font-size="11">Cohort Allocation Analytics</text>
  <text x="765" y="200" text-anchor="middle" fill="#94a3b8" font-size="11">Supervisor Quota &amp; Deadlines</text>

  <!-- CONNECTOR 1 -->
  <line x1="480" y1="230" x2="480" y2="265" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4"/>
  <text x="490" y="252" fill="#cbd5e1" font-size="11">HTTPS / REST (JSON + JWT)</text>

  <!-- LAYER 2: API & BACKEND SERVICES -->
  <rect x="50" y="270" width="860" height="235" rx="12" fill="url(#serviceGrad)" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="300" fill="#22d3ee" font-size="14" font-weight="700">2. APPLICATION LAYER (FastAPI + Pydantic + Uvicorn)</text>

  <rect x="70" y="315" width="220" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="180" y="342" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Auth &amp; RBAC Service</text>
  <text x="180" y="362" text-anchor="middle" fill="#94a3b8" font-size="11">JWT Token Validation &amp; Roles</text>

  <rect x="310" y="315" width="220" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="420" y="342" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Topic Catalog Service</text>
  <text x="420" y="362" text-anchor="middle" fill="#94a3b8" font-size="11">CRUD, Prereqs &amp; Capacity Caps</text>

  <rect x="550" y="315" width="340" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="720" y="342" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Team Workflow Service</text>
  <text x="720" y="362" text-anchor="middle" fill="#94a3b8" font-size="11">Formation, Invitations &amp; Applications</text>

  <!-- MATCHING ENGINE HIGHLIGHT BOX -->
  <rect x="70" y="400" width="820" height="90" rx="8" fill="url(#engineGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="90" y="425" fill="#fbbf24" font-size="13" font-weight="700">INTELLIGENT MATCHING ENGINE (Scikit-Learn + NumPy)</text>
  <text x="90" y="450" fill="#e2e8f0" font-size="12">• Cosine Vector Similarity: Matches student competency vectors against topic required tags</text>
  <text x="90" y="470" fill="#e2e8f0" font-size="12">• Complementary Role Balancer: Minimizes redundant roles (FE/BE/ML/Mobile) across teams</text>

  <!-- CONNECTOR 2 -->
  <line x1="480" y1="505" x2="480" y2="540" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="527" fill="#cbd5e1" font-size="11">SQLAlchemy ORM / psycopg2</text>

  <!-- LAYER 3: DATA LAYER -->
  <rect x="50" y="545" width="860" height="135" rx="12" fill="url(#dbGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="575" fill="#34d399" font-size="14" font-weight="700">3. PERSISTENCE &amp; DATA LAYER (PostgreSQL 16 Relational Database)</text>

  <rect x="70" y="590" width="185" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="162" y="618" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Users &amp; Roles</text>
  <text x="162" y="638" text-anchor="middle" fill="#94a3b8" font-size="10">Students, Supervisors,</text>
  <text x="162" y="652" text-anchor="middle" fill="#94a3b8" font-size="10">Admins &amp; Auth Tokens</text>

  <rect x="275" y="590" width="185" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="367" y="618" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Topics &amp; Tags</text>
  <text x="367" y="638" text-anchor="middle" fill="#94a3b8" font-size="10">Deliverables, Capacities,</text>
  <text x="367" y="652" text-anchor="middle" fill="#94a3b8" font-size="10">Supervisor Assignments</text>

  <rect x="480" y="590" width="185" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="572" y="618" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Teams &amp; Members</text>
  <text x="572" y="638" text-anchor="middle" fill="#94a3b8" font-size="10">Rosters, Invitations,</text>
  <text x="572" y="652" text-anchor="middle" fill="#94a3b8" font-size="10">Application Statuses</text>

  <rect x="685" y="590" width="205" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="787" y="618" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="600">Competency Matrix</text>
  <text x="787" y="638" text-anchor="middle" fill="#94a3b8" font-size="10">Skills, Proficiencies,</text>
  <text x="787" y="652" text-anchor="middle" fill="#94a3b8" font-size="10">Target Role Preferences</text>
</svg>
