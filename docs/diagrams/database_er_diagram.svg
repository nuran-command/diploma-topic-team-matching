<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="dot" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6">
      <circle cx="4" cy="4" r="3" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="480" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Relational Data Model (PostgreSQL)</text>
  <text x="480" y="65" text-anchor="middle" fill="#94a3b8" font-size="12">Core entities supporting topic allocation, profiles, and team assembly</text>

  <!-- ENTITY: USERS -->
  <g transform="translate(40, 100)" filter="url(#cardShadow)">
    <rect width="240" height="180" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="240" height="32" rx="8" fill="#0284c7"/>
    <text x="120" y="21" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">USER (users)</text>
    <text x="15" y="55" fill="#f1f5f9" font-size="11" font-family="monospace">+ id: int [PK]</text>
    <text x="15" y="75" fill="#94a3b8" font-size="11" font-family="monospace">+ email: varchar [UNIQUE]</text>
    <text x="15" y="95" fill="#94a3b8" font-size="11" font-family="monospace">+ hashed_password: str</text>
    <text x="15" y="115" fill="#94a3b8" font-size="11" font-family="monospace">+ role: enum (STUDENT/SUP/ADM)</text>
    <text x="15" y="135" fill="#94a3b8" font-size="11" font-family="monospace">+ full_name: varchar</text>
    <text x="15" y="155" fill="#94a3b8" font-size="11" font-family="monospace">+ created_at: timestamp</text>
  </g>

  <!-- ENTITY: STUDENT_PROFILE -->
  <g transform="translate(360, 100)" filter="url(#cardShadow)">
    <rect width="240" height="180" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="240" height="32" rx="8" fill="#0284c7"/>
    <text x="120" y="21" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">STUDENT_PROFILE</text>
    <text x="15" y="55" fill="#f1f5f9" font-size="11" font-family="monospace">+ id: int [PK]</text>
    <text x="15" y="75" fill="#38bdf8" font-size="11" font-family="monospace">+ user_id: int [FK -> users.id]</text>
    <text x="15" y="95" fill="#94a3b8" font-size="11" font-family="monospace">+ student_id: varchar</text>
    <text x="15" y="115" fill="#94a3b8" font-size="11" font-family="monospace">+ primary_role: enum (FE/BE/ML)</text>
    <text x="15" y="135" fill="#94a3b8" font-size="11" font-family="monospace">+ gpa: float</text>
    <text x="15" y="155" fill="#94a3b8" font-size="11" font-family="monospace">+ bio: text</text>
  </g>

  <!-- ENTITY: TOPIC -->
  <g transform="translate(680, 100)" filter="url(#cardShadow)">
    <rect width="240" height="180" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="240" height="32" rx="8" fill="#0284c7"/>
    <text x="120" y="21" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">TOPIC (topics)</text>
    <text x="15" y="55" fill="#f1f5f9" font-size="11" font-family="monospace">+ id: int [PK]</text>
    <text x="15" y="75" fill="#38bdf8" font-size="11" font-family="monospace">+ supervisor_id: int [FK]</text>
    <text x="15" y="95" fill="#94a3b8" font-size="11" font-family="monospace">+ title: varchar</text>
    <text x="15" y="115" fill="#94a3b8" font-size="11" font-family="monospace">+ description: text</text>
    <text x="15" y="135" fill="#94a3b8" font-size="11" font-family="monospace">+ max_team_size: int (2-3)</text>
    <text x="15" y="155" fill="#94a3b8" font-size="11" font-family="monospace">+ status: enum (AVAILABLE..)</text>
  </g>

  <!-- ENTITY: SKILLS & COMPETENCIES -->
  <g transform="translate(40, 360)" filter="url(#cardShadow)">
    <rect width="240" height="180" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="240" height="32" rx="8" fill="#7e22ce"/>
    <text x="120" y="21" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">STUDENT_SKILLS</text>
    <text x="15" y="55" fill="#f1f5f9" font-size="11" font-family="monospace">+ id: int [PK]</text>
    <text x="15" y="75" fill="#c084fc" font-size="11" font-family="monospace">+ profile_id: int [FK]</text>
    <text x="15" y="95" fill="#c084fc" font-size="11" font-family="monospace">+ skill_id: int [FK]</text>
    <text x="15" y="115" fill="#94a3b8" font-size="11" font-family="monospace">+ proficiency: int (1-5)</text>
    <text x="15" y="135" fill="#94a3b8" font-size="11" font-family="monospace">+ verified: boolean</text>
    <text x="15" y="155" fill="#94a3b8" font-size="11" font-family="monospace">+ years_exp: float</text>
  </g>

  <!-- ENTITY: TEAMS -->
  <g transform="translate(360, 360)" filter="url(#cardShadow)">
    <rect width="240" height="180" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="240" height="32" rx="8" fill="#047857"/>
    <text x="120" y="21" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">TEAM &amp; MEMBERS</text>
    <text x="15" y="55" fill="#f1f5f9" font-size="11" font-family="monospace">+ id: int [PK]</text>
    <text x="15" y="75" fill="#34d399" font-size="11" font-family="monospace">+ leader_id: int [FK]</text>
    <text x="15" y="95" fill="#94a3b8" font-size="11" font-family="monospace">+ name: varchar</text>
    <text x="15" y="115" fill="#94a3b8" font-size="11" font-family="monospace">+ status: enum (FORMING..)</text>
    <text x="15" y="135" fill="#34d399" font-size="11" font-family="monospace">+ member_profile_id: int [FK]</text>
    <text x="15" y="155" fill="#94a3b8" font-size="11" font-family="monospace">+ invitation_status: enum</text>
  </g>

  <!-- ENTITY: APPLICATIONS -->
  <g transform="translate(680, 360)" filter="url(#cardShadow)">
    <rect width="240" height="180" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="240" height="32" rx="8" fill="#b45309"/>
    <text x="120" y="21" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">APPLICATION</text>
    <text x="15" y="55" fill="#f1f5f9" font-size="11" font-family="monospace">+ id: int [PK]</text>
    <text x="15" y="75" fill="#fbbf24" font-size="11" font-family="monospace">+ team_id: int [FK]</text>
    <text x="15" y="95" fill="#fbbf24" font-size="11" font-family="monospace">+ topic_id: int [FK]</text>
    <text x="15" y="115" fill="#94a3b8" font-size="11" font-family="monospace">+ status: enum (PENDING..)</text>
    <text x="15" y="135" fill="#94a3b8" font-size="11" font-family="monospace">+ feedback: text</text>
    <text x="15" y="155" fill="#94a3b8" font-size="11" font-family="monospace">+ submitted_at: timestamp</text>
  </g>

  <!-- RELATION LINES -->
  <line x1="280" y1="190" x2="360" y2="190" stroke="#38bdf8" stroke-width="2"/>
  <line x1="600" y1="190" x2="680" y2="190" stroke="#38bdf8" stroke-width="2"/>
  <line x1="480" y1="280" x2="480" y2="360" stroke="#10b981" stroke-width="2"/>
  <line x1="600" y1="450" x2="680" y2="450" stroke="#f59e0b" stroke-width="2"/>
  <line x1="240" y1="280" x2="240" y2="360" stroke="#a855f7" stroke-width="2"/>
</svg>
